name: Build macOS app (Apple Silicon)

# Builds LazyAstroPhotoSuite.app for Apple Silicon (arm64) with PyInstaller on GitHub's
# macos-14 runner — those runners ARE Apple Silicon, so the produced .app is native arm64.
# Download the .zip from the run's "Artifacts" (or a Release, when triggered by a tag).
#
# TRIGGERS: manual dispatch and version tags (macOS runners bill at 10× on private repos, so
# this does not build on every push). Trigger from the repo's Actions tab → "Build macOS app
# (Apple Silicon)" → Run workflow, or push a `v*` tag. To also build on every push to main, add
# `branches: [main]` back under `push:`.
#
# NOTE: the .app is UNSIGNED and un-notarized (no Apple Developer cert in CI). On first launch
# users must right-click → Open (or `xattr -dr com.apple.quarantine LazyAstroPhotoSuite.app`).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  macos:
    runs-on: macos-14                       # Apple Silicon (arm64) runner
    permissions:
      contents: write                       # create/attach to the tag's Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"            # arm64 CPython on macos-14

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,video,bg,tools,build]"

      - name: Build the .app
        env:
          PYTHON: python                     # use the CI interpreter (no local .venv-build here)
        run: bash build/build_macos.sh

      - name: Package (ditto preserves the bundle's symlinks + resource forks)
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "build/dist/LazyAstroPhotoSuite.app" \
            "LazyAstroPhotoSuite-macos-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: LazyAstroPhotoSuite-macos-arm64
          path: LazyAstroPhotoSuite-macos-arm64.zip
          retention-days: 30

      - name: Attach to the tag's GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: LazyAstroPhotoSuite-macos-arm64.zip
          fail_on_unmatched_files: true
